name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    # 08:17 Asia/Taipei (UTC+8); avoid the top-of-hour queue.
    - cron: '17 0 * * *'
  push:
    branches: [main]
    paths: ['config/daily.yaml', '.github/workflows/main.yml']

permissions:
  contents: write

concurrency:
  group: daily-paper-delivery
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Configure existing account settings
        env:
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        shell: bash
        run: |
          if [ -n "$CUSTOM_CONFIG" ]; then
            printf '%b\n' "$CUSTOM_CONFIG" > config/custom.yaml
          fi

      - name: Retrieve, rank and send exactly 10 papers
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          HF_HUB_DOWNLOAD_TIMEOUT: '45'
          HF_HUB_ETAG_TIMEOUT: '30'
        run: uv run --locked src/zotero_arxiv_daily/main.py --config-name=daily

      - name: Persist successful delivery history
        if: always()
        shell: bash
        run: |
          if [ -f .state/delivery.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .state/delivery.json
            if ! git diff --cached --quiet; then
              git commit -m 'chore: record daily paper delivery [skip ci]'
              git pull --rebase --autostash origin main
              git push origin HEAD:main
            fi
          fi

      - name: Preserve delivery checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-checkpoint-${{ github.run_id }}
          path: .state/delivery.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
